name: Temporary Whisper model fetch

on:
  push:
    branches:
      - tmp-whisper-model-fetch-20260901

jobs:
  fetch-model:
    runs-on: ubuntu-latest
    steps:
      - name: Download Whisper tiny q5_1 model
        run: |
          curl -L --fail --retry 3 \
            https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny-q5_1.bin \
            -o ggml-tiny-q5_1.bin
          sha256sum ggml-tiny-q5_1.bin
      - name: Upload model artifact
        uses: actions/upload-artifact@v4
        with:
          name: ggml-tiny-q5_1-bin
          path: ggml-tiny-q5_1.bin
          retention-days: 1
